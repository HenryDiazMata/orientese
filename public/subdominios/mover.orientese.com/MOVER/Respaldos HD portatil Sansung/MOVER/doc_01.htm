			<p align="center">
			<textarea rows="21" name="S1" cols="90" style="font-family: Arial; font-size: 10pt">Bienvenidos

Esta página se inicia con la esperanza de ser útil y agradable.

La Venezuela de hoy día vive una peligrosa y difícil realidad.

Como Sociedad y Estado, estamos bastante mal.

Un grupo se ha adueñado del Estado, cuando se les confirió el poder hace ya 14 años.
Este grupo puede estar, o no, apoyado por una determinada mayoría, lo cual no le da permiso para que se destruya lo que es de TODOS.

Como bien sabemos, la Democracia es el gobierno de las MAYORIAS y la República es el gobierno de la LEY la cual sirve a TODOS, no a una mayoría equis, sino a TODOS.

Quienes quieran agruparse de una manera mas seria a este Movimiento, formando una SOCIEDAD, con sus estatutos, con sus objetivos, visión y misión, así como sentido y razón de ser y hacer; se les agradece, enviar su deseo a la siguiente dirección: "movervenezuela@gmail.com".

En el asunto del mensaje deberán indicar: Solicitud de ingreso al Movimiento Esperanza (R); y en el cuerpo del mensaje deberán enviar sus datos ciudadanos, (Número de C. I., nombre completo, fecha de nacimiento, Dirección de residencia) así como personales, (Ocupación actual, habilidades y destrezas), y datos de interés como: cuáles son los aportes que pueda hacer en tiempo y económicos, para el sostenimiento del Movimiento. Ejemplo: Puedo darle media hora semanal transcribiendo documentos o haciendo fotografías, o creando una presentación, pintando un cuadro, imprimiendo una franela, preparando una comida, colaborando en un taller, una convivencia, curso o reunión, orando, y/o dando XXX Bs mensuales.

La aceptación de la solicitud será evaluada por todos, y todos votaremos, la aceptación o no del ingreso, en la condición de allegado, aliado o amigo del Movimiento.

Las solicitudes se podrán hacer, luego de terminados los Estatutos que estamos redactando, de manera que luego de leerlos, Usted podrá solicitar el ingreso, sabiendo cuales serán sus deberes y derechos en esta SOCIEDAD CIVIL.

Como se indicó al inicio, estamos viviendo una realidad que nos presenta un futuro mucho mas delicado y peligroso para TODOS, las condiciones económicas del país, los convenios que se han suscrito, las condiciones pactadas, nos colocan en una situación de extremo peligro. Quienes no apoyan, ni son parte del grupo gobernante, quedarán en una situación de supervivencia, bastante seria. O se tendrá que plegar o padecerá las medidas represivas que se implementarán.

Si levantamos un poquito la mirada, podremos notar que el gobernante esta creando sus espacios y están dejando a un lado a quienes no les son sumisos. Las medidas que se implementarán a mediados del primer semestre del año entrante, pueden estar orientadas hacia el cumplimiento de unas "leyes aprobadas", en el mes de diciembre del 2011, mediante la habilitante, lo que les hace inconstitucionales e ilegales, por mas que hayan sido aprobadas y refrendadas por quienes se benefician de ellas.

Estas Leyes deben ser cumplidas de ahora en adelante, es lo que ellos llaman Segunda Etapa en la construcción del socialismo del siglo xxi. Quien no las cumpla quedará al margen de la "Ley" y sufrirá las consecuencias.

Como se podrá notar, el pasado proceso electoral no solo no produjo un presidente nuevo, sino que es el inicio de un "nivel", con condiciones mas exigentes y perjudiciales para nosotros, los que estamos educados hacia el respeto de la Ley, hacia los valores y principios de igualdad, libertad, decencia, orden, etc., estamos mas indefensos.

Si nos quedamos separados, cada quien por su lado, tratando de resolver sus problemas de manera individual, sola, le será mas difícil avanzar sin doblar la cerviz al gobernante. En cambio, si se une, se organiza, se prepara en todos los aspectos posibles, será mas fuerte y podrá resistir mejor los embates y lo mas importante, podrá hacerse de una fuerza que le permita recuperar sus bienes, desde el gentilicio, hasta la patria misma, pasando por sus territorios, sus culturas, sus propiedades, su esencia del ser.

Es evidente que mientras mas numeroso y polifacético sea el grupo, es mejor. También es muy evidente que el grupo debe estar conformado solo por no chavistas. Darle ingreso a personas que defienden, son parte o simpatizantes con ese concepto, de manera directa o indirecta, es perjudicar a este Movimiento.

Mientras mas discretos seamos, mejor. Mientras mas nos organicemos, mejor. Mientras mas aprovechemos nuestras capacidades y habilidades, mejor estaremos y avanzaremos.

Apenas se terminen los Estatutos, se inicia el proceso de solicitud de ingreso. El objetivo propuesto es Recuperar nuestra patria y refundar nuestra República y con ello, construir el mejor país del mundo, nuestro país, esta Tierra de Gracia que llamamos Venezuela...

La vía inicial es mediante un proceso que forme, promueva y difunda los valores y principios de la república.

Bienvenidos...</textarea></p>
