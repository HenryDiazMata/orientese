<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oriéntese - En Reconstrucción</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 720px;
      width: 100%;
    }
    .logo {
      max-width: 540px;
      height: auto;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 1.5rem;
      color: #1a252f;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background-color: #e8f4fd;
      color: #0077ff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Ruta al logo en la carpeta public_html -->
    <img src="/logos/logotipo orientese 2018 Azul 01.GIF" alt="Oriéntese Logo" class="logo">
    
    <h1>Estamos renovando nuestro portal</h1>
    <p>Estamos trabajando en la nueva versión de <strong>Oriéntese</strong> para ofrecerte una experiencia más moderna y completa.</p>
    
    <span class="badge">Próximamente 2026</span>
  </div>

</body>
</html>
