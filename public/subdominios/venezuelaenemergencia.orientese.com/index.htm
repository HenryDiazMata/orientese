				<p>
				<textarea rows="18" name="S1" cols="36" style="font-family: Arial">Nos acogemos al Artículo 350 de la constitución vigente (año 1999) que dice: "Artículo 350 El pueblo de Venezuela, fiel a su tradición republicana, a su lucha por la independencia, la paz y la libertad, desconocerá cualquier régimen, legislación o autoridad que contraríe los valores, principios y garantías democráticos o menoscabe los derechos humanos."; y a todos los artículos que garantizan los Derechos Humanos coherentes con el sistema filosófico y político llamado La República.

Los creadores, colaboradores, aliados y voluntarios, están esparcidos por el mundo, profesan diferentes credos, ejercen diferentes profesiones, hablan idiomas diferentes, pero tienen el mismo objetivo, colaborar por la recuperación de la patria venezolana y la refundación de La República en Venezuela; valga decir que los valores y principios de libertad, igualdad, respeto, propiedad y seguridad, vuelvan a ser la norma y la base de todo el estamento legal y la cultura social en la jurisdicción de esta república.

Si Usted se identifica con esto, puede unirse a esta tarea y colaborar en la medida de sus posibilidades, desde donde esté. Gracias</textarea></p>
